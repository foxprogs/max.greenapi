<svg xmlns="http://www.w3.org/2000/svg" width="250" height="250" viewBox="0 0 250 250" fill="none" stroke="#e3f3ff" stroke-opacity=".7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <title>Фон переписки</title>
  <!-- Иконки 24×24, масштаб 1.25 и поворот вокруг центра; все внутри тайла, чтобы стыки были бесшовными. -->
  <!-- карандаш -->
  <g transform="translate(18 16) rotate(-20 15 15) scale(1.25)"><path d="M4 20l1-5L16 4l4 4L9 19z M14 6l4 4 M5 15l4 4"/></g>
  <!-- тетрадь -->
  <g transform="translate(92 10) rotate(12 15 15) scale(1.25)"><rect x="6" y="3" width="14" height="18" rx="2"/><path d="M4 7h4 M4 12h4 M4 17h4 M11 8h6 M11 12h6"/></g>
  <!-- звезда -->
  <g transform="translate(172 22) rotate(8 15 15) scale(1.05)"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4l-5.3 3 1.2-6-4.5-4.1 6-.7z"/></g>
  <!-- ручка -->
  <g transform="translate(26 92) rotate(28 15 15) scale(1.25)"><path d="M9 2h6v4H9z M9 6h6l-1 12-2 4-2-4z M15 3h1.5v6"/></g>
  <!-- открытая книга -->
  <g transform="translate(112 84) rotate(-8 15 15) scale(1.25)"><path d="M2 5c3-1 7-1 10 1 3-2 7-2 10-1v14c-3-1-7-1-10 1-3-2-7-2-10-1z M12 6v14"/></g>
  <!-- скрепка -->
  <g transform="translate(200 92) rotate(30 15 15) scale(1.25)"><path d="M16 7v9a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10a1 1 0 0 1-2 0V7"/></g>
  <!-- линейка -->
  <g transform="translate(58 160) rotate(-35 15 15) scale(1.25)"><rect x="2" y="8" width="20" height="8" rx="1"/><path d="M6 8v3 M10 8v4 M14 8v3 M18 8v4"/></g>
  <!-- лампочка -->
  <g transform="translate(156 150) rotate(10 15 15) scale(1.25)"><path d="M9 18h6 M10 21h4 M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></g>
  <!-- ножницы -->
  <g transform="translate(196 188) rotate(-15 15 15) scale(1.2)"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8 16L18 4 M16 16L6 4"/></g>
  <!-- сообщение -->
  <g transform="translate(108 200) rotate(-6 15 15) scale(1.2)"><path d="M4 5h16v10H9l-5 4z M8 9h8 M8 12h5"/></g>
  <!-- ластик -->
  <g transform="translate(14 198) rotate(6 15 15) scale(1.2)"><path d="M3 16l9-9 6 6-6 6H6z M8.5 10.5l6 6 M13 19h8"/></g>
  <!-- мелкие заполнители -->
  <path d="M80 67v6 M77 70h6 M182 105v6 M179 108h6 M236 147v6 M233 150h6 M95 139v6 M92 142h6 M240 12v6 M237 15h6"/>
  <circle cx="150" cy="14" r="1.8"/><circle cx="18" cy="150" r="1.8"/><circle cx="238" cy="236" r="1.8"/><circle cx="70" cy="238" r="1.8"/><circle cx="150" cy="120" r="1.8"/>
</svg>
